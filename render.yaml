# Render Blueprint - lets the whole server + database be created from one
# "New > Blueprint" pointing at this repo, instead of clicking through
# service creation by hand. See server/README.md for what this service does.
databases:
  - name: sms-quest-db
    plan: free

services:
  - type: web
    name: sms-quest-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sms-quest-db
          property: connectionString
      - key: NODE_ENV
        value: production
